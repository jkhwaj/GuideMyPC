name: Repository cleanup audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Create cleanup report
        run: php scripts/audit-repository-cleanup.php > cleanup-audit.txt

      - name: Upload cleanup report
        uses: actions/upload-artifact@v4
        with:
          name: repository-cleanup-audit
          path: cleanup-audit.txt
          if-no-files-found: error
          retention-days: 1

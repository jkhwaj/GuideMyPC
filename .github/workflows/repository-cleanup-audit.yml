name: Repository cleanup audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show PHP version
        run: php --version

      - name: Audit tracked files
        run: php scripts/audit-repository-cleanup.php

      - name: Validate PHP syntax
        run: php scripts/lint.php

      - name: Validate submission structure
        run: php tests/submission_structure_test.php

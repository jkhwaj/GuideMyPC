name: Repository cleanup validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, openssl, fileinfo, curl
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit repository files
        run: php scripts/audit-repository-cleanup.php

      - name: Lint tracked PHP files
        run: php scripts/lint.php

      - name: Run dependency-free tests
        run: |
          php tests/helpers_test.php
          php tests/authorization_test.php
          php tests/route_map_test.php
          php tests/submission_structure_test.php

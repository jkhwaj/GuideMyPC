<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <style>text{font-family:Arial,sans-serif;fill:#182230}.title{font-size:34px;font-weight:bold}.label{font-size:25px;font-weight:bold}.small{font-size:20px}.box{fill:#f7f9fc;stroke:#2563a8;stroke-width:3}.security{fill:#eef8ee;stroke:#27824b;stroke-width:3}.db{fill:#fff6df;stroke:#b7791f;stroke-width:3}.arrow{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <text x="900" y="60" text-anchor="middle" class="title">GuideMyPC system architecture</text>
  <rect x="80" y="180" width="250" height="150" rx="16" class="box"/><text x="205" y="235" text-anchor="middle" class="label">User</text><text x="205" y="275" text-anchor="middle" class="small">Desktop or mobile</text>
  <rect x="440" y="150" width="300" height="210" rx="16" class="box"/><text x="590" y="205" text-anchor="middle" class="label">Browser</text><text x="590" y="245" text-anchor="middle" class="small">HTML, CSS, Vanilla JavaScript</text><text x="590" y="280" text-anchor="middle" class="small">Forms, DOM and Fetch</text><text x="590" y="315" text-anchor="middle" class="small">Rendered HTML responses</text>
  <rect x="870" y="150" width="280" height="210" rx="16" class="box"/><text x="1010" y="215" text-anchor="middle" class="label">Apache / XAMPP</text><text x="1010" y="255" text-anchor="middle" class="small">HTTP requests</text><text x="1010" y="290" text-anchor="middle" class="small">public/ entry point</text>
  <rect x="1280" y="120" width="350" height="270" rx="16" class="box"/><text x="1455" y="180" text-anchor="middle" class="label">PHP 8.2 application</text><text x="1455" y="220" text-anchor="middle" class="small">Server-rendered PHP routes</text><text x="1455" y="255" text-anchor="middle" class="small">Bootstrap and business logic</text><text x="1455" y="290" text-anchor="middle" class="small">Two bounded Search JSON endpoints</text><text x="1455" y="325" text-anchor="middle" class="small">search_suggestions.php / search_event.php</text>
  <rect x="1280" y="510" width="350" height="245" rx="16" class="security"/><text x="1455" y="570" text-anchor="middle" class="label">Security and request handling</text><text x="1455" y="610" text-anchor="middle" class="small">Sessions and authentication</text><text x="1455" y="645" text-anchor="middle" class="small">Authorization and role checks</text><text x="1455" y="680" text-anchor="middle" class="small">CSRF, validation and error handling</text><text x="1455" y="715" text-anchor="middle" class="small">Prepared statements and transactions</text>
  <rect x="790" y="820" width="410" height="170" rx="16" class="db"/><text x="995" y="885" text-anchor="middle" class="label">MariaDB 10.4</text><text x="995" y="925" text-anchor="middle" class="small">Relational data and migrations</text><text x="995" y="960" text-anchor="middle" class="small">Parameterized database access</text>
  <path d="M330 255 H440" class="arrow"/><text x="380" y="235" text-anchor="middle" class="small">interaction</text>
  <path d="M740 255 H870" class="arrow"/><text x="805" y="235" text-anchor="middle" class="small">HTTP</text>
  <path d="M1150 255 H1280" class="arrow"/><path d="M1280 290 H1150" class="arrow"/>
  <path d="M1455 390 V510" class="arrow"/><path d="M1350 755 L1110 820" class="arrow"/><path d="M950 820 L950 390 H870" class="arrow"/>
  <text x="690" y="470" text-anchor="middle" class="small">HTML responses return through Apache to the browser</text>
</svg>

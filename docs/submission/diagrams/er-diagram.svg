<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" viewBox="0 0 1900 1200">
  <style>text{font-family:Arial,sans-serif;fill:#182230}.title{font-size:34px;font-weight:bold}.head{font-size:23px;font-weight:bold}.field{font-size:18px}.entity{fill:#f7f9fc;stroke:#2563a8;stroke-width:3}.line{stroke:#475569;stroke-width:3;fill:none}.card{font-size:18px;font-weight:bold}</style>
  <text x="950" y="55" text-anchor="middle" class="title">GuideMyPC ER diagram: central active entities</text>
  <g transform="translate(70 150)"><rect width="250" height="185" rx="10" class="entity"/><text x="125" y="35" text-anchor="middle" class="head">users</text><text x="20" y="70" class="field">PK id : bigint</text><text x="20" y="100" class="field">role_id : bigint FK</text><text x="20" y="130" class="field">email : varchar</text><text x="20" y="160" class="field">status : varchar</text></g>

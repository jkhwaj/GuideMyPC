<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" viewBox="0 0 1900 1200">
  <style>
    text { font-family: Arial, sans-serif; fill: #182230; }
    .title { font-size: 34px; font-weight: bold; }
    .note { font-size: 18px; fill: #475569; }
    .head { font-size: 23px; font-weight: bold; }
    .field { font-size: 18px; }
    .entity { fill: #f7f9fc; stroke: #2563a8; stroke-width: 3; }
    .line { stroke: #475569; stroke-width: 3; fill: none; }
    .card { font-size: 17px; font-weight: bold; fill: #334155; }
  </style>
  <text x="950" y="50" text-anchor="middle" class="title">GuideMyPC ER diagram: active central schema</text>
  <text x="950" y="82" text-anchor="middle" class="note">Only migration-backed tables, fields, and foreign-key relationships are shown.</text>

  <g transform="translate(65 145)"><rect width="290" height="180" rx="10" class="entity"/><text x="145" y="35" text-anchor="middle" class="head">users</text><text x="20" y="70" class="field">PK id : int unsigned</text><text x="20" y="100" class="field">role : enum(user, editor, admin)</text><text x="20" y="130" class="field">email : varchar(150)</text><text x="20" y="160" class="field">status : enum(active, disabled)</text></g>
  <g transform="translate(65 500)"><rect width="290" height="145" rx="10" class="entity"/><text x="145" y="35" text-anchor="middle" class="head">user_progress</text><text x="20" y="70" class="field">PK id : int unsigned</text><text x="20" y="100" class="field">FK user_id : int unsigned</text><text x="20" y="130" class="field">FK guide_step_id : int unsigned</text></g>
  <g transform="translate(65 820)"><rect width="290" height="145" rx="10" class="entity"/><text x="145" y="35" text-anchor="middle" class="head">community_posts</text><text x="20" y="70" class="field">PK id : int unsigned</text><text x="20" y="100" class="field">FK user_id : int unsigned</text><text x="20" y="130" class="field">is_published : tinyint(1)</text></g>

  <g transform="translate(475 145)"><rect width="290" height="145" rx="10" class="entity"/><text x="145" y="35" text-anchor="middle" class="head">categories</text><text x="20" y="70" class="field">PK id : int unsigned</text><text x="20" y="100" class="field">name : varchar(100)</text><text x="20" y="130" class="field">is_published : tinyint(1)</text></g>
  <g transform="translate(475 380)"><rect width="290" height="145" rx="10" class="entity"/><text x="145" y="35" text-anchor="middle" class="head">guides</text><text x="20" y="70" class="field">PK id : int unsigned</text><text x="20" y="100" class="field">FK category_id : int unsigned nullable</text><text x="20" y="130" class="field">is_published : tinyint(1)</text></g>
  <g transform="translate(475 620)"><rect width="290" height="145" rx="10" class="entity"/><text x="145" y="35" text-anchor="middle" class="head">guide_steps</text><text x="20" y="70" class="field">PK id : int unsigned</text><text x="20" y="100" class="field">FK guide_id : int unsigned</text><text x="20" y="130" class="field">step_number : int unsigned</text></g>

  <g transform="translate(900 145)"><rect width="300" height="145" rx="10" class="entity"/><text x="150" y="35" text-anchor="middle" class="head">diagnostic_flow_versions</text><text x="20" y="70" class="field">PK id : bigint unsigned</text><text x="20" y="100" class="field">FK flow_id : bigint unsigned</text><text x="20" y="130" class="field">version_number : int unsigned</text></g>
  <g transform="translate(900 380)"><rect width="300" height="145" rx="10" class="entity"/><text x="150" y="35" text-anchor="middle" class="head">diagnostic_sessions</text><text x="20" y="70" class="field">PK id : bigint unsigned</text><text x="20" y="100" class="field">FK version_id : bigint unsigned</text><text x="20" y="130" class="field">user_id : int nullable</text></g>
  <g transform="translate(900 620)"><rect width="300" height="145" rx="10" class="entity"/><text x="150" y="35" text-anchor="middle" class="head">downloads</text><text x="20" y="70" class="field">PK id : int unsigned</text><text x="20" y="100" class="field">category : varchar(100)</text><text x="20" y="130" class="field">review_state : enum(...)</text></g>

  <g transform="translate(1380 520)"><rect width="310" height="145" rx="10" class="entity"/><text x="155" y="35" text-anchor="middle" class="head">community_comments</text><text x="20" y="70" class="field">PK id : int unsigned</text><text x="20" y="100" class="field">FK post_id : int unsigned</text><text x="20" y="130" class="field">FK user_id : int unsigned</text></g>
  <g transform="translate(1380 800)"><rect width="310" height="145" rx="10" class="entity"/><text x="155" y="35" text-anchor="middle" class="head">community_likes</text><text x="20" y="70" class="field">PK id : int unsigned</text><text x="20" y="100" class="field">FK post_id : int unsigned</text><text x="20" y="130" class="field">FK user_id : int unsigned</text></g>

